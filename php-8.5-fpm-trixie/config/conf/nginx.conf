server {
    listen 80;
    server_name ${APP_HOST};
    index index.php index.html index.htm;
    root ${APP_PATH};

    # Лимиты
    client_max_body_size 100M;
    client_body_timeout 60s;

    # Логи (рекомендуется)
    access_log /var/log/nginx/${APP_HOST}_access.log;
    error_log /var/log/nginx/${APP_HOST}_error.log;

    # Служебные файлы репозитория: корень монтируется целиком (./:${APP_PATH})
    location ~ /\. {
        deny all;
        access_log off;
    }

    location ~* ^/(docker-compose\.ya?ml|makefile)$ {
        deny all;
        access_log off;
    }

    location ^~ /docker/ {
        deny all;
        access_log off;
    }

    location ^~ /attachments/ {
        deny all;
        access_log off;
    }

    # Основная обработка
    location / {
        try_files $uri $uri/ @bitrix;
    }

    location @bitrix {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/bitrix/urlrewrite.php;
        fastcgi_param REQUEST_URI $uri?$args;
        fastcgi_param QUERY_STRING $args;
    }

    # Обработка PHP
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Специфичные для Bitrix параметры
        fastcgi_param PHP_VALUE "
            max_execution_time = 300
            max_input_time = 300
            memory_limit = 256M
            post_max_size = 100M
            upload_max_filesize = 100M
            date.timezone = Europe/Moscow
        ";
    }

    # Обработка 404
    error_page 404 = @bitrix_404;
    location @bitrix_404 {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/404.php;
        fastcgi_param REQUEST_URI $uri?$args;
    }
}
